name: Check static website
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.mjs
      - run: node scripts/check.mjs
      - name: Check committed HTML matches source data
        run: git diff --exit-code -- '*.html' sitemap.xml
